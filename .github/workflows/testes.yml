name: testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # pywebview não instala sem GTK/Qt no runner e a suíte não toca nele:
      # o que os testes exercitam é o núcleo e as rotas do Flask.
      - name: instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flask>=3.0" "yt-dlp>=2025.1.1" pytest

      - name: rodar os testes
        run: pytest testes -q
